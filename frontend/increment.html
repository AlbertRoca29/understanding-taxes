<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Increment de sou</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <div class="main-grid">

            <!-- LEFT: form -->
            <div class="form-panel">
                <h1>Increment de sou</h1>
                <form id="incrementForm">
                    <div class="form-row">
                        <label for="sou_actual">Sou actual <span class="req">*</span></label>
                        <div class="input-affix">
                            <input type="text" inputmode="decimal" data-money autocomplete="off" id="sou_actual" name="sou_actual" required placeholder="Ex: 25.000">
                        </div>
                    </div>
                    <div class="form-row">
                        <label for="sou_nou">Nou sou <span class="req">*</span></label>
                        <div class="input-affix">
                            <input type="text" inputmode="decimal" data-money autocomplete="off" id="sou_nou" name="sou_nou" required placeholder="Ex: 27.000">
                        </div>
                    </div>
                    <div class="form-row">
                        <label for="n_pagues">Nombre de pagues <span class="req">*</span></label>
                        <input type="number" id="n_pagues" name="n_pagues" required min="1" max="15" step="1" value="14" placeholder="Ex: 14">
                    </div>
                    <div class="form-row">
                        <label for="grup_cotitzacio">Grup de cotització SS <span class="req">*</span></label>
                        <select id="grup_cotitzacio" name="grup_cotitzacio" required></select>
                    </div>
                    <div class="form-row">
                        <label>Tipus de contracte</label>
                        <div class="pill-group" id="contractTypePills">
                            <button type="button" aria-pressed="true" class="pill selected" data-value="indefinite">Indefinit</button>
                            <button type="button" aria-pressed="false" class="pill" data-value="temporary">Temporal</button>
                        </div>
                        <input type="hidden" id="contract_type" name="contract_type" value="indefinite">
                    </div>
                    <div class="form-row">
                        <label>La teva discapacitat</label>
                        <div class="pill-group" id="disabilitySelfPills">
                            <button type="button" aria-pressed="true" class="pill selected" data-value="0">Cap</button>
                            <button type="button" aria-pressed="false" class="pill" data-value="50">33–64%</button>
                            <button type="button" aria-pressed="false" class="pill" data-value="80">65% o més</button>
                        </div>
                        <input type="hidden" id="disability_self" value="0">
                        <div class="field-hint">Fills, ascendents i edat no modifiquen l'increment: el seu efecte es cancel·la entre el sou actual i el nou.</div>
                    </div>
                    <button type="submit" class="btn-submit">Calcular increment</button>
                </form>
            </div>

            <!-- RIGHT: results -->
            <div class="result-panel">
                <div class="result-placeholder" id="resultPlaceholder">
                    Introdueix els sous i prem <strong>Calcular increment</strong> per veure la diferència neta.
                </div>
                <div id="result" aria-live="polite"></div>
                <div id="plots"></div>
            </div>

        </div>
    </div>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="shared.js"></script>
    <script>
    fillGrupSelect('grup_cotitzacio');
    initMoneyInputs();
    bindPills('contractTypePills', 'contract_type');
    bindPills('disabilitySelfPills', 'disability_self');

    function renderResult(r, nPagues) {
        return resultHero(`Increment net per paga (${nPagues})`, fmtEur(r.increment_annual_net / nPagues),
                `Equivalent mensual (÷12): ${fmtEur(r.increment_monthly_net)}`)
            + resultSection("Resum de l'increment", [
                ['Increment brut anual', '+' + fmtEur(r.increment_annual_brut)],
                ['− SS addicional', '−' + fmtEur(r.increment_annual_ss), 'minus'],
                ['− IRPF addicional', '−' + fmtEur(r.increment_annual_irpf), 'minus'],
                ['Increment net anual', fmtEur(r.increment_annual_net), 'total'],
            ]);
    }

    let requestSeq = 0;
    document.getElementById('incrementForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const seq = ++requestSeq;
        const souActual = readMoney('sou_actual');
        const souNou = readMoney('sou_nou');
        const nPagues = parseInt(document.getElementById('n_pagues').value);

        const resultEl = document.getElementById('result');
        const plotsEl = document.getElementById('plots');
        document.getElementById('resultPlaceholder').style.display = 'none';
        plotsEl.innerHTML = '';

        if (isNaN(souActual) || isNaN(souNou) || souNou <= souActual) {
            showError(resultEl, 'El nou sou ha de ser superior al sou actual.');
            return;
        }

        showLoading(resultEl);
        const restoreButton = setSubmitting(this);

        try {
            const result = await postApi('/api/increment', {
                previous_gross: souActual,
                new_gross: souNou,
                n_pagues: nPagues,
                pagues_prorratejades: false,
                retribucio_en_especie_ann: 0,
                grup_cotitzacio: document.getElementById('grup_cotitzacio').value,
                contract_type: document.getElementById('contract_type').value,
                other_deductions: 0,
                age: 30,
                disability_self: parseInt(document.getElementById('disability_self').value)
            });
            if (seq !== requestSeq) return; // ja hi ha una petició més nova
            resultEl.innerHTML = renderResult(result, nPagues);
            if (result.increment_pie) {
                plotsEl.innerHTML = chartCard(result.increment_pie, "Gràfic de l'increment", 'pie');
            }
            scrollToResultsIfStacked();
        } catch (err) {
            if (seq !== requestSeq) return;
            showError(resultEl, err.message);
        } finally {
            restoreButton();
        }
    });
    </script>
</body>
</html>
