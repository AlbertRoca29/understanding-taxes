<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Increment de sou</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <div class="main-grid">

            <!-- LEFT: form -->
            <div class="form-panel">
                <h1>Increment de sou</h1>
                <form id="incrementForm">
                    <div class="form-row">
                        <label for="sou_actual">Sou actual <span class="req">*</span></label>
                        <div class="input-affix">
                            <input type="text" inputmode="decimal" data-money autocomplete="off" id="sou_actual" name="sou_actual" required placeholder="Ex: 25.000">
                        </div>
                    </div>
                    <div class="form-row">
                        <label for="sou_nou">Nou sou <span class="req">*</span></label>
                        <div class="input-affix">
                            <input type="text" inputmode="decimal" data-money autocomplete="off" id="sou_nou" name="sou_nou" required placeholder="Ex: 27.000">
                        </div>
                    </div>
                    <div id="profileFields" style="display:contents"></div>

                    <button type="submit" class="btn-submit">Calcular increment</button>
                </form>
            </div>

            <!-- RIGHT: results -->
            <div class="result-panel">
                <div class="result-placeholder" id="resultPlaceholder">
                    Introdueix els sous i prem <strong>Calcular increment</strong> per veure la diferència neta.
                </div>
                <div id="result" aria-live="polite"></div>
                <div id="walkthrough"></div>
                <div id="plots"></div>
            </div>

        </div>
    </div>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="shared.js"></script>
    <script src="profile.js"></script>
    <script src="walkthrough.js"></script>
    <script>
    // Amb dos sous, mana el més baix: és on el grup pot afectar.
    Profile.mount(document.getElementById('profileFields'), {
        grossForGroup: () => { const v = ['sou_actual', 'sou_nou'].map(readMoney).filter(Number.isFinite); return v.length ? Math.min(...v) : NaN; },
        watchIds: ['sou_actual', 'sou_nou'],
    });

    function renderResult(r, nPagues) {
        const prev = r.previous, now = r.new;
        const nomDelta = now.nomina_net_per_paga - prev.nomina_net_per_paga;
        return resultHeroPair(`Increment net per paga (${nPagues})`, fmtEur(r.increment_annual_net / nPagues),
                nPagues !== 12 ? `Equivalent mensual (÷12): ${fmtEur(r.increment_monthly_net)}` : '',
                'A la nòmina hi veuràs', (nomDelta >= 0 ? '+' : '−') + fmtEur(Math.abs(nomDelta)), 'per paga')
            + resultSection("Resum de l'increment", [
                ['Increment brut anual', '+' + fmtEur(r.increment_annual_brut)],
                ['− SS addicional', '−' + fmtEur(r.increment_annual_ss), 'minus'],
                ['− IRPF addicional', '−' + fmtEur(r.increment_annual_irpf), 'minus'],
                ['Increment net anual', fmtEur(r.increment_annual_net), 'total'],
                ["De cada 100 € bruts de l'increment et queden",
                    `<b>${fmtEur(r.increment_annual_brut ? r.increment_annual_net / r.increment_annual_brut * 100 : 0)}</b>`],
            ])
            + resultSection('Abans → després', [
                ['Tipus efectiu IRPF', `${fmtPct(prev.tipus_efectiu)} → <b>${fmtPct(now.tipus_efectiu)}</b>`],
                [`Sou net per paga (${nPagues})`, `${fmtEur(prev.sou_net_per_paga)} → <b>${fmtEur(now.sou_net_per_paga)}</b>`],
                ['A la nòmina hi veuràs', `${fmtEur(prev.nomina_net_per_paga)} → ${fmtEur(now.nomina_net_per_paga)}`, 'sub'],
            ]);
    }

    let requestSeq = 0;
    document.getElementById('incrementForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const seq = ++requestSeq;
        const souActual = readMoney('sou_actual');
        const souNou = readMoney('sou_nou');
        const profile = Profile.read();
        const nPagues = profile.n_pagues;

        const resultEl = document.getElementById('result');
        const plotsEl = document.getElementById('plots');
        const wtEl = document.getElementById('walkthrough');
        document.getElementById('resultPlaceholder').style.display = 'none';
        plotsEl.innerHTML = '';
        wtEl.innerHTML = '';

        if (isNaN(souActual) || isNaN(souNou) || souNou <= souActual) {
            showError(resultEl, 'El nou sou ha de ser superior al sou actual.');
            return;
        }

        showLoading(resultEl);
        const restoreButton = setSubmitting(this);

        try {
            const result = await postApi('/api/increment', { previous_gross: souActual, new_gross: souNou, ...profile });
            if (seq !== requestSeq) return; // ja hi ha una petició més nova
            resultEl.innerHTML = renderResult(result, nPagues);
            if (result.new?.walkthrough) {
                Walkthrough.render(wtEl, result.new.walkthrough, result.previous.walkthrough, { region: profile.region });
            }
            if (result.increment_pie) {
                plotsEl.innerHTML = chartCard(result.increment_pie, "Gràfic de l'increment", 'pie');
            }
            scrollToResultsIfStacked();
        } catch (err) {
            if (seq !== requestSeq) return;
            showError(resultEl, err.message);
        } finally {
            restoreButton();
        }
    });
    </script>
</body>
</html>
