<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de sou net</title>
    <meta name="description" content="Del sou brut al net (i al revés) amb l'algorisme oficial de retencions de l'AEAT 2026.">
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <div class="main-grid">
            <div class="form-panel">
                <div id="formIntro"></div>
                <form id="calcForm" onsubmit="return false" novalidate>
                    <div id="amountBlock" style="display:contents"></div>
                    <div id="profileFields" style="display:contents"></div>
                </form>
            </div>

            <div class="result-panel">
                <div class="result-placeholder" id="resultPlaceholder"></div>
                <div id="result" aria-live="polite"></div>
                <div id="walkthrough"></div>
            </div>
        </div>
    </div>

    <button type="button" class="result-dock" id="resultDock" hidden></button>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="shared.js"></script>
    <script src="profile.js"></script>
    <script src="walkthrough.js"></script>
    <script src="charts.js"></script>
    <script src="app.js"></script>
</body>
</html>
