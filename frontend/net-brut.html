<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Del net al brut</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <div class="main-grid">

            <!-- LEFT: form -->
            <div class="form-panel">
                <h1>Del net al brut</h1>
                <p class="page-subtitle">Quin sou brut anual necessites per cobrar un net mensual concret.</p>
                <form id="netForm">
                    <div class="form-row">
                        <label for="net">Sou net mensual <span class="req">*</span></label>
                        <div class="input-affix">
                            <input type="text" inputmode="decimal" data-money autocomplete="off" id="net" name="net" required placeholder="Ex: 1.800">
                        </div>
                        <div class="field-hint">El que vols cobrar a cada paga (amb 14 pagues, també a les dues extres).</div>
                    </div>

                    <div id="profileFields" style="display:contents"></div>

                    <button type="submit" class="btn-submit">Calcular brut</button>
                </form>
            </div>

            <!-- RIGHT: results -->
            <div class="result-panel">
                <div class="result-placeholder" id="resultPlaceholder">
                    Introdueix el net que vols cobrar i prem <strong>Calcular brut</strong> per veure el sou brut anual necessari.
                </div>
                <div id="result" aria-live="polite"></div>
                <div id="walkthrough"></div>
                <div id="plots"></div>
            </div>

        </div>
    </div>

    <footer class="site-footer" id="site-footer"></footer>

    <script src="shared.js"></script>
    <script src="profile.js"></script>
    <script src="walkthrough.js"></script>
    <script>
    // El brut encara no se sap: el net anual n'és una cota inferior, i amb una cota
    // inferior el selector mai amaga un grup que podria canviar el resultat.
    Profile.mount(document.getElementById('profileFields'), {
        grossForGroup: () => readMoney('net') * (parseInt(document.getElementById('n_pagues').value) || 14),
        watchIds: ['net', 'n_pagues'],
    });
    // Els botons de pagues canvien el camp sense disparar "input": avisem el selector de grup
    document.querySelectorAll('#paguesPills .pill').forEach(p => p.addEventListener('click', () =>
        document.getElementById('n_pagues').dispatchEvent(new Event('input'))));

    function renderResult(r, npagues, especie) {
        const heroSub = [`${fmtEur(r.gross / npagues)} bruts per paga (${npagues})`];
        if (npagues !== 12) heroSub.push(`Equivalent mensual (÷12): ${fmtEur(r.gross / 12)}`);
        if (especie > 0) heroSub.push(`Sense comptar ${fmtEur(especie)} en espècie`);
        return resultHero('Sou brut anual necessari', fmtEur(r.gross), heroSub.join(' · '))
            + resultSection('Comprovació', [
                [`Net per paga (${npagues})`, `<b>${fmtEur(r.sou_net_per_paga)}</b>`],
                ['Net anual', fmtEur(salaryNetAnnual(r))],
                ['Retenció IRPF', fmtPct(r.tipo_retencio)],
            ])
            + salaryBreakdown(r, npagues);
    }

    let requestSeq = 0;
    document.getElementById('netForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const seq = ++requestSeq;
        const profile = Profile.read();
        const net = readMoney('net');

        const resultEl = document.getElementById('result');
        const plotsEl = document.getElementById('plots');
        const wtEl = document.getElementById('walkthrough');
        document.getElementById('resultPlaceholder').style.display = 'none';
        wtEl.innerHTML = '';
        plotsEl.innerHTML = '';

        if (!(net > 0)) {
            showError(resultEl, 'Introdueix un sou net superior a 0.');
            return;
        }

        showLoading(resultEl);
        const restoreButton = setSubmitting(this);

        try {
            const result = await postApi('/api/net-to-gross', { net_per_paga: net, ...profile });
            if (seq !== requestSeq) return; // ja hi ha una petició més nova
            resultEl.innerHTML = renderResult(result, profile.n_pagues, profile.retribucio_en_especie_ann);
            if (result.walkthrough) Walkthrough.render(wtEl, result.walkthrough, null, { region: profile.region });
            if (Array.isArray(result.plots)) {
                plotsEl.innerHTML = result.plots
                    .map((img, i) => chartCard(img, 'Gràfic ' + (i + 1), i === 0 ? 'pie' : 'lines'))
                    .join('');
            }
            scrollToResultsIfStacked();
        } catch (err) {
            if (seq !== requestSeq) return;
            showError(resultEl, err.message);
        } finally {
            restoreButton();
        }
    });
    </script>
</body>
</html>
